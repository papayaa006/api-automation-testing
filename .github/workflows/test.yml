name: API Automated Tests

# 觸發時機：當有人 push 到 main 分支，或發起 PR 時觸發
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest  # 使用 GitHub 提供的最新 Ubuntu 雲端環境

    steps:
    # 1. 檢出程式碼到虛擬機
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 設定 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # 3. 安裝相依套件
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytest

    # 4. 執行自動化測試
    - name: Run pytest
      run: |
        pytest test_api.py -v